<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="tortilla-title tortilla-desc">
  <title id="tortilla-title">Spanish tortilla illustration</title>
  <desc id="tortilla-desc">A line-art Spanish tortilla on a plate with a cut slice.</desc>
  <style>
    .blueprint-stroke { fill: none; stroke: #2a4fd7; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .blueprint-fill { fill: rgba(42, 79, 215, 0.08); stroke: #2a4fd7; stroke-width: 3; }
    .blueprint-soft { fill: none; stroke: rgba(42, 79, 215, 0.28); stroke-width: 2; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .blueprint-stroke { stroke: #5b82ff; }
      .blueprint-fill { fill: rgba(91, 130, 255, 0.12); stroke: #5b82ff; }
      .blueprint-soft { stroke: rgba(91, 130, 255, 0.35); }
    }
  </style>

  <!-- Plate -->
  <ellipse cx="400" cy="285" rx="230" ry="130" class="blueprint-stroke" />
  <ellipse cx="400" cy="285" rx="160" ry="85" class="blueprint-soft" />

  <!-- Main tortilla -->
  <ellipse cx="400" cy="280" rx="140" ry="85" class="blueprint-fill" />

  <!-- Lifted slice -->
  <g transform="translate(70, -35)">
    <path d="M400 280 L537.87 265.24 A140 85 0 0 1 447.94 359.91 Z" class="blueprint-fill" />
    <!-- Interior layers -->
    <path d="M400 280 L511.28 268.20 A110 66.79 0 0 1 437.67 341.75 Z" class="blueprint-soft" />
    <path d="M400 280 L484.69 271.17 A80 48.57 0 0 1 427.40 323.58 Z" class="blueprint-soft" />
    <path d="M400 280 L458.11 274.13 A50 30.36 0 0 1 417.12 305.42 Z" class="blueprint-soft" />
  </g>

  <!-- Herb garnish -->
  <circle cx="330" cy="240" r="4" class="blueprint-fill" />
  <circle cx="460" cy="310" r="3" class="blueprint-fill" />
  <path d="M325 260 Q335 250 345 260" class="blueprint-soft" />
</svg>
