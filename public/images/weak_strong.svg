<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Weak vs Strong Learners</title>
  <desc id="desc">A diagram contrasting many simple weak learners with one complex strong learner.</desc>
  <style>
    text { font-family: 'IBM Plex Mono', monospace; font-size: 14px; fill: currentColor; }
    .label { font-size: 12px; opacity: 0.7; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .weak { stroke-dasharray: 4 4; }
  </style>
  <g transform="translate(40,40)">
    <text x="120" y="0" text-anchor="middle" class="label">WEAK LEARNERS</text>
    <rect x="0" y="20" width="80" height="50" class="box weak" rx="4"/>
    <rect x="100" y="20" width="80" height="50" class="box weak" rx="4"/>
    <rect x="200" y="20" width="80" height="50" class="box weak" rx="4"/>
    <rect x="50" y="90" width="80" height="50" class="box weak" rx="4"/>
    <rect x="150" y="90" width="80" height="50" class="box weak" rx="4"/>
    <text x="140" y="170" text-anchor="middle" class="label">many simple models → ensemble</text>
  </g>
  <g transform="translate(400,40)">
    <text x="100" y="0" text-anchor="middle" class="label">STRONG LEARNER</text>
    <rect x="0" y="40" width="200" height="120" class="box" rx="8"/>
    <text x="100" y="110" text-anchor="middle">complex model</text>
  </g>
</svg>