<aside id="profile-container" class="profile-aside">
    <div class="profile">
        {{ with .Site.Params.profileImage }}
        <div class="profile-img">
            <img src="{{ . }}" alt="{{ $.Site.Author.name }}" height="150" width="150">
        </div>
        {{ end }}
        <h3 class="profile-name">{{ .Site.Params.author.name }}</h3>
        <p class="profile-subtitle">{{ .Site.Params.profileSubtitle }}</p>
        <div class="profile-social">
            {{ range .Site.Params.socialIcons }}
            <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">
                {{ partial "svg.html" . }}
            </a>
            {{ end }}
        </div>
    </div>
</aside>
