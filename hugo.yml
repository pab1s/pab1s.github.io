baseURL: 'https://pab1s.github.io/'
languageCode: en-us
title: Pablo Olivares
theme: PaperMod
pagination:
  pagerSize: 6

# Site metadata
description: "Pablo Olivares - ML Engineer & Data Scientist passionate about AI, Topological Data Analysis, and nature. Explore my projects, blog posts, and professional journey."
keywords: ["machine learning", "data science", "artificial intelligence", "topological data analysis", "pablo olivares", "ML engineer", "data alchemist"]

params:
  # Author information (moved to params for Hugo v0.124.0+ compatibility)
  author:
    name: Pablo Olivares
    email: pablolivares1502@gmail.com
  
  # Papermod specific settings
  defaultTheme: auto
  showDarkModeSwitch: true
  mainSections: ["blog"]
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  disableSpecial1stPost: true
  ShowToc: true
  math: true
  profileSubtitle: "ML Engineer, Data Alchemist & Nature Lover!"
  profileImage: 'avatar.png'
  disableSearch: false
  searchIncludeContent: true
  fuseOpts:
    minMatchCharLength: 2
    threshold: 0.3
    keys: [title, permalink, summary, content, tags]
  assets:
    disableFingerprinting: false  # Enable fingerprinting for better caching
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "safari-pinned-tab.svg"
    theme_color: "#2e2e33"
    msapplication_TileColor: "#2e2e33"
  customCSS:
    - assets/css/extended/fonts.css
    - assets/css/extended/profile-card.css
    - assets/css/extended/project.css

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/pablolivares/?locale=en_US"
    - name: github
      url: "https://github.com/pab1s"
    - name: email
      url: "mailto:pablolivares1502@gmail.com"

menu:
  main:
    - identifier: blog
      name: Blog
      url: "/blog/"
      weight: 1
    - identifier: projects
      name: Projects
      url: "/projects/"
      weight: 2
    - identifier: resume
      name: Resume
      url: "/resume/"
      weight: 3

outputs:
  home: 
    - HTML
    - RSS
    - JSON